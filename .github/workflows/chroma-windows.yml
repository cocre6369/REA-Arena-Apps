name: Chroma Studio Windows download

on:
  push:
    branches: [arena/79d49780-rea-arena-apps]
    paths:
      - 'apps/studio/**'
      - '.github/workflows/chroma-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - name: Install packaging dependencies
        run: npm ci --no-audit --no-fund
      - name: Build portable and installer executables
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath 'cmd.exe' -ArgumentList '/c', 'npm run dist -- --publish never > build.log 2>&1' -NoNewWindow -Wait -PassThru
          $code = $proc.ExitCode
          $log = Get-Content build.log -Raw
          Write-Output $log
          if ($code -ne 0) {
            $annotation = ($log -replace '\r?\n', '%0A')
            Write-Host "::error title=Windows build failure::$annotation"
            exit $code
          }
      - name: Upload downloadable Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: Chroma-Studio-Windows-x64
          path: apps/studio/dist/*.exe
          if-no-files-found: error
          retention-days: 30
