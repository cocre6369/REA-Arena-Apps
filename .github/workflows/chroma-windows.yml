name: Chroma Studio Windows download

on:
  push:
    branches: [arena/79d49780-rea-arena-apps]
    paths:
      - 'apps/studio/**'
      - '.github/workflows/chroma-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - name: Install packaging dependencies
        run: npm ci --no-audit --no-fund
      - name: Build portable and installer executables
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run dist
      - name: Upload downloadable Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: Chroma-Studio-Windows-x64
          path: apps/studio/dist/*.exe
          if-no-files-found: error
          retention-days: 30
